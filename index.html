<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hyphen Formatter Tool</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #f6f9fc, #e3f2fd);
      margin: 0;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      color: #333;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 700px;
      width: 100%;
    }
    h2 {
      margin-top: 0;
      font-weight: 600;
      color: #2a4d69;
      text-align: center;
    }
    p {
      text-align: center;
      color: #555;
      font-size: 15px;
    }
    textarea, pre {
      width: 100%;
      height: 180px;
      margin: 12px 0;
      padding: 12px;
      font-size: 14px;
      border: 1px solid #ccd;
      border-radius: 8px;
      resize: vertical;
      background: #fafafa;
      font-family: monospace;
      line-height: 1.5;
    }
    button {
      background: #4a90e2;
      color: white;
      border: none;
      padding: 12px 24px;
      cursor: pointer;
      border-radius: 8px;
      font-size: 14px;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #357ab8;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      background: #fdfdfd;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Hyphen Formatter Tool</h2>
    <p>Paste your text below, format it, and copy the results.</p>
    
    <textarea id="inputText" placeholder="Enter text here..."></textarea>
    
    <div class="actions">
      <button onclick="formatText()">Format</button>
      <button onclick="copyOutput()">Copy Output</button>
    </div>
    
    <h3>Output:</h3>
    <pre id="outputText"></pre>
  </div>

  <script>
    function formatStringsWithHyphen(inputText) {
      const lines = inputText.trim().split('\n');
      return lines.map(line => 
        line.toLowerCase().replace(/\s+/g, '-') + ','
      ).join('\n');
    }

    function formatText() {
      const input = document.getElementById('inputText').value;
      const output = formatStringsWithHyphen(input);
      document.getElementById('outputText').textContent = output;
    }

    function copyOutput() {
      const output = document.getElementById('outputText').textContent;
      if (output.trim() !== "") {
        navigator.clipboard.writeText(output).then(() => {
          alert("Output copied to clipboard!");
        });
      }
    }
  </script>
</body>
</html>
