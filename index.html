<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      color: #212529;
      transition: background-color 0.3s, color 0.3s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .navbar {
      background-color: #ffffff;
      border-bottom: 1px solid #dee2e6;
      transition: background-color 0.3s;
    }

    /* Toggle switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #c5c5c5;
      transition: 0.4s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #6c63ff;
    }
    input:checked + .slider:before {
      transform: translateX(24px);
      background-color: #121212;
    }

    /* Dark mode styles */
    .dark-mode {
      background-color: #1a1b26;
      color: #e0e0e0;
    }
    .dark-mode .navbar {
      background-color: #232434;
      border-color: #2d2e40;
    }
    .dark-mode .btn-primary {
      background-color: #6c63ff;
      border-color: #6c63ff;
    }
    .dark-mode .btn-outline-secondary {
      color: #e0e0e0;
      border-color: #6c63ff;
    }
    .dark-mode .btn-outline-secondary:hover {
      background-color: #6c63ff;
      color: #fff;
    }

    .footer {
      text-align: center;
      padding: 15px 0;
      border-top: 1px solid #dee2e6;
      font-size: 0.9rem;
    }
    .footer a {
      color: #0d6efd;
      text-decoration: none;
    }
    .dark-mode .footer {
      border-color: #2d2e40;
    }
    .dark-mode .footer a {
      color: #6c63ff;
    }

    /* Toast styling */
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1055;
    }
  </style>
</head>
<body>
  <nav class="navbar px-3 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-type-bold fs-3 text-primary"></i>
      <span class="fw-bold fs-4">Text Form</span>
    </div>

    <!-- Dark mode toggle -->
    <label class="switch mb-0">
      <input type="checkbox" id="darkModeToggle">
      <span class="slider"></span>
    </label>
  </nav>

  <main class="container my-4">
    <div class="mb-3">
      <textarea id="inputText" class="form-control" rows="6" placeholder="Enter your text here..."></textarea>
    </div>

    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-primary" onclick="formatText('upper')">UPPERCASE</button>
      <button class="btn btn-primary" onclick="formatText('lower')">lowercase</button>
      <button class="btn btn-outline-secondary" onclick="copyOutput()">Copy Output</button>
    </div>

    <div class="mt-4">
      <h5>Output:</h5>
      <pre id="outputText" class="p-3 border rounded bg-light"></pre>
    </div>
  </main>

  <div class="footer">
   © 2025 <a href="#">Text Formatter Tool</a> • Made with ❣️ by <a href="https://github.com/Faiyazmahmud75" target="_blank">Faiyaz</a> • Powered by <a href="https://zhrdigital.com" target="_blank">ZHR Digital</a>
  </div>

  <div class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Text format function
    function formatText(type) {
      const input = document.getElementById('inputText').value;
      const output = document.getElementById('outputText');
      if (type === 'upper') output.textContent = input.toUpperCase();
      if (type === 'lower') output.textContent = input.toLowerCase();
    }

    // Toast notification
    function showToast(message) {
      const container = document.querySelector('.toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast align-items-center text-white bg-success border-0 show';
      toast.setAttribute('role', 'alert');
      toast.innerHTML = `
        <div class="d-flex">
          <div class="toast-body">${message}</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function copyOutput() {
      const output = document.getElementById('outputText').textContent;
      if (output.trim() !== "") {
        navigator.clipboard.writeText(output).then(() => {
          showToast("✅ Output copied to clipboard!");
        });
      }
    }

    // Dark mode toggle
    const toggle = document.getElementById('darkModeToggle');
    toggle.addEventListener('change', () => {
      document.body.classList.toggle('dark-mode', toggle.checked);
    });
  </script>
</body>
</html>
