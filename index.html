<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hyphen Formatter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      text-align: center;
    }
    textarea, pre {
      width: 100%;
      height: 200px;
      margin: 10px 0;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
    }
    button {
      background: #333;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
    }
    button:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <h2>Hyphen Formatter Tool</h2>
  <p>Paste your text below:</p>
  <textarea id="inputText"></textarea>
  <br>
  <button onclick="formatText()">Format</button>
  <h3>Output:</h3>
  <pre id="outputText"></pre>

  <script>
    function formatStringsWithHyphen(inputText) {
      const lines = inputText.trim().split('\n');
      return lines.map(line => 
        line.toLowerCase().replace(/\s+/g, '-') + ','
      ).join('\n');
    }

    function formatText() {
      const input = document.getElementById('inputText').value;
      const output = formatStringsWithHyphen(input);
      document.getElementById('outputText').textContent = output;
    }
  </script>
</body>
</html>
